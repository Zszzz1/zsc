<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>纯 CSS 颜色动画盒子</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1f2937, #0f172a 60%);
      font-family: "Microsoft YaHei", sans-serif;
    }

    .demo-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .ring {
      position: absolute;
      width: 340px;
      height: 340px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      animation: rotateRing 10s linear infinite;
    }

    .orb {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff, #a5b4fc);
      box-shadow: 0 0 20px rgba(255,255,255,0.7);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: orbit 6s ease-in-out infinite;
    }

    .color-box {
      position: relative;
      z-index: 1;
      width: 260px;
      height: 260px;
      border-radius: 28px;
      background: #ff6b6b;
      border: 6px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      animation: colorCycle 8s ease-in-out infinite,
                 floatBox 4s ease-in-out infinite,
                 pulseScale 8s ease-in-out infinite;
      overflow: hidden;
    }

    .color-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.35), rgba(255,255,255,0.02));
      border-radius: 20px;
    }

    .color-box::after {
      content: "CSS Animation";
      position: absolute;
      left: 20px;
      bottom: 18px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .dot {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      top: 16%;
      left: 18%;
      animation: dotMove 6s ease-in-out infinite;
    }

    .label {
      position: relative;
      z-index: 1;
      font-size: 20px;
      font-weight: 700;
      color: #e5eefc;
      letter-spacing: 2px;
      animation: textFlash 8s ease-in-out infinite;
    }

    @keyframes colorCycle {
      0% { background: #ff6b6b; }
      25% { background: #ffd93d; }
      50% { background: #6bcf7f; }
      75% { background: #4dabf7; }
      100% { background: #ff6b6b; }
    }

    @keyframes floatBox {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-18px) rotate(2deg);
      }
    }

    @keyframes pulseScale {
      0%, 100% {
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }
      50% {
        box-shadow: 0 30px 50px rgba(77, 171, 247, 0.45);
      }
    }

    @keyframes textFlash {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes orbit {
      0% {
        transform: translate(-50%, -50%) rotate(0deg) translateX(165px);
      }
      50% {
        transform: translate(-50%, -50%) rotate(180deg) translateX(135px);
      }
      100% {
        transform: translate(-50%, -50%) rotate(360deg) translateX(165px);
      }
    }

    @keyframes dotMove {
      0%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: 0.7;
      }
      50% {
        transform: translate(120px, 60px) scale(1.4);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="ring"></div>
    <div class="orb"></div>
    <div class="color-box">
      <div class="dot"></div>
    </div>
    <div class="label">颜色循环动画</div>
  </div>
</body>
</html>
