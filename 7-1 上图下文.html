<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* 推荐加上，防止 padding 撑破宽度 */
        }
        ul {
            list-style: none;
        }
        img {
            display: block;
            width: 100%; /* 让图片自适应容器宽度 */
            height: 100%; /* 如果需要统一高度可以加上，不需要可删除 */
            object-fit: cover; /* 配合 height: 100% 使用，防止图片变形 */
        }
        .ilist {
            display: flex;
            margin: 8px;
        }
        /* 注意这里改成了 .ilist */
        .ilist li {
            width: 30%;
            margin-right: 3px;
            flex-grow: 1;
            /* 【关键】加上相对定位，作为内部绝对定位元素的参照物 */
            position: relative;
            overflow: hidden; /* 防止内容溢出 */
        }
        /* 注意这里也改成了 .ilist */
        .ilist p {
            /* 居中 */
            text-align: center;
            font-size: 14px;
            line-height: 33px;
            /* 绝对定位 */
            position: absolute;
            bottom: 0;
            left: 0; /* 确保文字框左对齐 */
            width: 100%;
            background-color: rgba(0, 0, 0, .5);
            color: #fff;
            /* 加粗 */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <ul class="ilist">
        <li>
            <!-- 请确保 ./img/1.png 路径下确实有图片，否则会显示裂图 -->
            <img src="./img/1.png" alt="图片1">
            <p>张顺昌的上图下文</p>
        </li>
        <li>
            <img src="./img/2.png" alt="图片2">
            <p>图片2</p> 
        </li>
        <li>
            <img src="./img/3.png" alt="图片3">
            <p>图片3</p>
        </li>
    </ul>
</body>
</html>
