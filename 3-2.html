<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>010 张顺昌</title>
    <style>
        /* 标签选择器 */
        p{
            color: #94a;
            font-size: 50px;
        }
        
        /* id选择器，以#开头 */
        #box{
            width: 600px;
            height: 500px;
            background-color: #ccc;
        }
        
        /* 类选择器 */
        .n1{
            color: red;
        }
        .n2{
            color: blue;
        }
        .n3{
            color: green;
        }

        /* 扩展2：h2黑底白字 */
        h2{
            background-color: black;
            color: white;
            padding: 10px;
        }

        /* 让"选择器"三个字变白色 */
        .white-text{
            color: white;
        }

        /* 扩展3：新增一个宽300高300的盒子，有背景颜色 */
        .new-box{
            width: 300px;
            height: 300px;
            background-color: orange;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    
    <div id="box">
        <!-- "选择器"三个字变为白色 -->
        <p>CSS<span class="white-text">选择器</span></p>
        
        <!-- 扩展1：名字的每个字不同颜色，在同一行 -->
        <p><span class="n1">张</span><span class="n2">顺</span><span class="n3">昌</span></p>
        
        <p>CSS属性</p>
    </div>

    <!-- 扩展3：新增一个宽300高300的盒子，有背景颜色 -->
    <div class="new-box">
    </div>
</body>
</html>
