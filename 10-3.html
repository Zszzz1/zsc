<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewport 背景响应动画</title>
  <style>
    :root {
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ff6b6b;
      transition: background 0.8s ease;
    }

    .full-box {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 0.125rem solid rgba(255,255,255,0.2);
      transition: all 0.8s ease;
    }

    .content {
      text-align: center;
      color: #fff;
      text-shadow: 0 0.25rem 1.125rem rgba(0, 0, 0, 0.2);
    }

    .content h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 6rem);
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .content p {
      margin-top: 1.125rem;
      font-size: clamp(1rem, 2vw, 1.6rem);
      letter-spacing: 0.08em;
    }

    .content .name {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.625rem 1.5rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.18);
      border: 0.0625rem solid rgba(255,255,255,0.18);
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    @media (max-width: 1200px) {
      :root {
        font-size: 15px;
      }

      body {
        background: #ffd93d;
      }
    }

    @media (max-width: 900px) {
      :root {
        font-size: 14px;
      }

      body {
        background: #6bcf7f;
      }

      .full-box {
        padding: 1.5rem;
      }
    }

    @media (max-width: 600px) {
      :root {
        font-size: 13px;
      }

      body {
        background: #4dabf7;
      }

      .content h1 {
        letter-spacing: 0.08em;
      }

      .content p {
        letter-spacing: 0.04em;
      }
    }
  </style>
</head>
<body>
  <div class="full-box">
    <div class="content">
      <h1>VIEWPORT</h1>
      <p>背景颜色随窗口变化而变化</p>
      <div class="name">张顺昌</div>
    </div>
  </div>
</body>
</html>
