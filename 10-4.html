<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>响应式八个盒子布局</title>
  <style>
    :root {
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #f3f4f6;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      width: min(100%, 1100px);
      background: #fff;
      border-radius: 1.25rem;
      box-shadow: 0 1.25rem 2.5rem rgba(15, 23, 42, 0.08);
      padding: 1.5rem;
    }

    .title {
      margin: 0 0 1.25rem;
      text-align: center;
      font-size: clamp(1.4rem, 2vw, 2rem);
      color: #1f2937;
      letter-spacing: 0.08em;
    }

    .box-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .box {
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      color: #fff;
      font-weight: 700;
      border-radius: 1rem;
      height: 8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0.75rem 1.5rem rgba(96, 165, 250, 0.25);
      transition: transform 0.2s ease;
    }

    .box:hover {
      transform: translateY(-0.2rem);
    }

    .box:nth-child(2n) {
      background: linear-gradient(135deg, #34d399, #10b981);
    }

    .box:nth-child(3n) {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
    }

    .box:nth-child(4n) {
      background: linear-gradient(135deg, #f472b6, #ec4899);
    }

    @media (min-width: 900px) {
      .box {
        width: calc((100% - 3rem) / 4);
      }
    }

    @media (max-width: 899px) and (min-width: 640px) {
      .box {
        width: calc((100% - 1rem) / 2);
      }
    }

    @media (max-width: 639px) {
      .box {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">张顺昌</h1>
    <div class="box-wrap">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
      <div class="box">7</div>
      <div class="box">8</div>
    </div>
  </div>
</body>
</html>
